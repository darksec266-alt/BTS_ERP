<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTS ERP — Test Page</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      font-family: Segoe UI, Tahoma, sans-serif;
      background: #0f172a;
      color: #ee8905;
    "
  >
    <header
      style="
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 28px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      "
    >
      <div style="display: flex; align-items: center; gap: 12px">
        <span
          style="
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
          "
          >B</span
        >
        <strong style="font-size: 18px">BTS ERP</strong>
      </div>
      <span
        style="
          font-size: 12px;
          padding: 6px 10px;
          border-radius: 999px;
          background: #14532d;
          color: #86efac;
        "
        >HTML test</span
      >
    </header>

    <main style="max-width: 960px; margin: 0 auto; padding: 32px 20px">
      <h1 style="margin: 0 0 8px; font-size: 28px">Test page</h1>
      <p style="margin: 0 0 28px; color: #94a3b8">
        Inline CSS smoke test. If this page looks styled, the browser can load
        static HTML from this folder.
      </p>

      <section
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 16px;
          margin-bottom: 24px;
        "
      >
        <article
          style="
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
          "
        >
          <p style="margin: 0; color: #94a3b8; font-size: 13px">Sites</p>
          <p style="margin: 8px 0 0; font-size: 28px; font-weight: 700">12</p>
        </article>
        <article
          style="
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
          "
        >
          <p style="margin: 0; color: #94a3b8; font-size: 13px">Open work orders</p>
          <p style="margin: 8px 0 0; font-size: 28px; font-weight: 700">5</p>
        </article>
        <article
          style="
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
          "
        >
          <p style="margin: 0; color: #94a3b8; font-size: 13px">Low stock items</p>
          <p style="margin: 8px 0 0; font-size: 28px; font-weight: 700; color: #fbbf24">
            3
          </p>
        </article>
      </section>

      <section
        style="
          background: #1e293b;
          border: 1px solid #334155;
          border-radius: 12px;
          padding: 20px;
        "
      >
        <h2 style="margin: 0 0 12px; font-size: 16px">Sample site</h2>
        <p style="margin: 0 0 6px"><strong>Name:</strong> DHK-BTS-001</p>
        <p style="margin: 0 0 6px"><strong>Location:</strong> Dhaka</p>
        <p style="margin: 0 0 16px"><strong>Status:</strong> Active</p>
        <button
          type="button"
          onclick="alert('BTS ERP test page is working.')"
          style="
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
          "
        >
          Run test
        </button>
      </section>
    </main>
  </body>
</html>
